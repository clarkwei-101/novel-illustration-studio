<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#6B6B80"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="120" y="90"  width="200" height="200" rx="22" fill="#2A6B5C"/>
  <rect x="160" y="120" width="200" height="200" rx="22" fill="#1E3A6E"/>
  <rect x="200" y="150" width="200" height="200" rx="22" fill="#E63946" filter="url(#glow)"/>

  <circle cx="300" cy="250" r="56" fill="#E63946" filter="url(#glowStrong)"/>
  <circle cx="300" cy="250" r="56" fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0.5"/>

  <text x="256" y="410"
        text-anchor="middle"
        fill="#E8E8E8"
        font-size="48"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-weight="700"
        letter-spacing="8">CYBER</text>

  <text x="256" y="448"
        text-anchor="middle"
        fill="#FFFFFF"
        fill-opacity="0.85"
        font-size="20"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-weight="300"
        letter-spacing="12">FOUNDATION</text>
</svg>